name: Auto-build Proton Bridge image

on:
  schedule:
    - cron: "23 3 * * *" # daily check
  workflow_dispatch:
    inputs:
      tag:
        description: "Forces build, skips version check."
        required: false
        type: string

jobs:
  build-if-needed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Versions
        id: check
        if: ${{ !inputs.tag }}
        run: |
          upstream_ver=$(curl --silent "https://api.github.com/repos/ProtonMail/proton-bridge/releases/latest" | grep '"name":' | grep -Eo "[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}" | sort -V | tail -n1)
          if [ -z "${upstream_ver}" ]; then
            echo "**** Can't receive external release, exiting ****"
            exit 1
          fi

          repo="${{ github.repository }}"
          repo="${repo,,}"
          if docker manifest inspect ghcr.io/$repo:$upstream_ver >/dev/null 2>&1; then
            echo "**** Version ${upstream_ver} already built, exiting ****"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tag=${upstream_ver}" >> "$GITHUB_OUTPUT"

      - name: Force build with custom tag
        id: force
        if: ${{ inputs.tag }}
        run: |
          input="${{ inputs.tag }}"
          version="${input%%-*}"

          upstream_ver=$(curl --silent "https://api.github.com/repos/ProtonMail/proton-bridge/tags" | grep '"name":' | grep -Eo "[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}" | grep -x "$version")
          if [ -z "$upstream_ver" ]; then
            echo "**** Version $version not found on upstream ****"
            exit 1
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Ready data for build
        id: ready
        if: ${{ steps.check.outputs.build == 'true' || steps.force.outputs.build == 'true' }}
        run: |
          if [ "${{ steps.force.outputs.build }}" = "true" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.force.outputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.check.outputs.build }}" = "true" ]; then
            echo "tag=${{ steps.check.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.check.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "**** Missing data ****"
            exit 1
          fi

          repo="${{ github.repository }}"
          repo_lower="${repo,,}"

          echo "image=ghcr.io/$repo_lower" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ steps.ready.outputs.build == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: ${{ steps.ready.outputs.build == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.ready.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: ${{ steps.ready.outputs.build == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.ready.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ready.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=protonmail-bridge
            org.opencontainers.image.description=Proton Mail Bridge built from source for Docker (Alpine, non-root)
            org.opencontainers.image.vendor=Lanjelin
            org.opencontainers.image.version=${{ steps.ready.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push image
        if: ${{ steps.ready.outputs.build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BRIDGE_VERSION=${{ steps.ready.outputs.version }}
